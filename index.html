<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Türk Telekom İş Takip Sistemi</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Türk Telekom İş Takip Sistemi</h1>
        <p>Proje ve bina bilgilerini görüntüleme sistemi</p>
    </header>

    <main>

        <section class="arama-alani">
            <h3>Excel Dosyası Yükle</h3>

<input
    type="file"
    id="excelDosyasi"
    accept=".xlsx, .xls"
>

            <h2>Bina ID ile Proje Ara</h2>

            <input
                type="text"
                id="binaId"
                placeholder="Bina ID giriniz"
            >

            <button onclick="binaAra()">
                Ara
            </button>

        </section>

        <section id="sonucAlani">

            <p>
                Bina ID girerek ilgili projeleri görüntüleyebilirsiniz.
            </p>

        </section>

    </main>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

    <script src="script.js"></script>

</body>
</html>
