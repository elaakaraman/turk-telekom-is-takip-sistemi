<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Türk Telekom İş Takip Sistemi</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>

<body>

<header>
<h1>Türk Telekom İş Takip Sistemi</h1>
<p>Excel verilerini okuyarak bina ve çizim bilgilerini görüntüler.</p>
</header>

<main>

<section class="arama-alani">

<h2>Proje Exceli</h2>

<input
type="file"
id="projeExcel"
accept=".xlsx,.xls">

<br><br>

<h2>Bina Exceli</h2>

<input
type="file"
id="binaExcel"
accept=".xlsx,.xls">

<br><br>

<h2>Bina ID / Çizim ID Ara</h2>

<input
type="text"
id="arama"
placeholder="Bina ID veya Çizim ID giriniz">

<button onclick="araBina()">
Bina ID Ara
</button>

<button onclick="araCizim()">
Çizim ID Ara
</button>

<button onclick="temizle()">
Temizle
</button>

</section>

<section id="sonucAlani">

<p>
Henüz arama yapılmadı.
</p>

</section>

</main>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="script.js?v=1"></script>

</body>
</html>
